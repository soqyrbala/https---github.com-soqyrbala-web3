<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Steppe &amp; Peaks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark site-nav">
      <div class="container">
        <a class="navbar-brand" href="index.html">Steppe &amp; Peaks</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Toggle menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="menu"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="about.html">About</a></li><li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li><li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li><li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li></ul></div>
      </div>
    </nav>
  </header>
  <main class="container py-5">
    <section class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <h2 class="text-center mb-4">Book a trip</h2>
        <form id="contact-form" action="#" method="post">
          <div class="mb-3"><label for="name" class="form-label">Name</label><input type="text" class="form-control" id="name" required></div>
          <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" required></div>
          <div class="mb-3"><label for="tour" class="form-label">Tour</label>
            <select class="form-select" id="tour"><option>Charyn Canyon</option><option>Kolsai Lakes</option><option>Altai Mountains</option></select></div>
          <div class="mb-3"><label for="msg" class="form-label">Message</label><textarea class="form-control" id="msg" rows="4"></textarea></div>
          <button type="submit" class="btn btn-saffron w-100">Send request</button>
        </form>
      </div>
    </section>
  </main>
  <footer class="py-4 text-center"><p class="mb-0">&copy; 2026 Steppe &amp; Peaks. Travel Kazakhstan.</p></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
